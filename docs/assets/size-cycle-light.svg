<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 408" width="840" height="408" role="img" aria-label="Tile size cycling diagram">
  <title>Tile size cycling diagram</title>
  <desc>Repeating left or right arrow cycles a side pane through half, two thirds, and third, then repeats. Repeating Enter cycles a full-height centered column through the same widths.</desc>
  <defs>
    <filter id="sc-light-float" x="-18%" y="-18%" width="136%" height="146%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <filter id="sc-light-snap" x="-10%" y="-10%" width="120%" height="126%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
    <clipPath id="sc-light-side-0-pane-clip"><rect x="187" y="75" width="85" height="104" rx="4.5"/></clipPath>
    <clipPath id="sc-light-side-1-pane-clip"><rect x="415" y="75" width="113.33" height="104" rx="4.5"/></clipPath>
    <clipPath id="sc-light-side-2-pane-clip"><rect x="643" y="75" width="56.67" height="104" rx="4.5"/></clipPath>
    <clipPath id="sc-light-center-0-pane-clip"><rect x="229.5" y="237" width="85" height="104" rx="4.5"/></clipPath>
    <clipPath id="sc-light-center-1-pane-clip"><rect x="443.33" y="237" width="113.33" height="104" rx="4.5"/></clipPath>
    <clipPath id="sc-light-center-2-pane-clip"><rect x="699.67" y="237" width="56.67" height="104" rx="4.5"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="839" height="407" rx="10" fill="#ffffff" stroke="#dfe3e8" stroke-width="1"/>
  <text x="24" y="34" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2937">Press again to cycle width</text>
  <g>
    <rect x="770" y="18" width="46" height="24" rx="5" fill="#cfd5de"/>
    <rect x="770.5" y="17.5" width="45" height="23" rx="5" fill="#f1f3f6" stroke="#dfe3e8" stroke-width="1"/>
    <text x="793" y="32.91" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1f2937">Win</text>
  </g>
  <text x="764" y="33" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#667085">Windows</text>
  <text x="706" y="33" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#667085">·</text>
  <g>
    <rect x="651" y="18" width="46" height="24" rx="5" fill="#cfd5de"/>
    <rect x="651.5" y="17.5" width="45" height="23" rx="5" fill="#f1f3f6" stroke="#dfe3e8" stroke-width="1"/>
