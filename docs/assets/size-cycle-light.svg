  <text x="272" y="364" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" font-size="12"><tspan font-weight="600" fill="#1f2937">½</tspan><tspan fill="#667085">  Center half</tspan></text>
  <g>
