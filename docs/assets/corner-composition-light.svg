<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 532" width="840" height="532" role="img" aria-label="Tile corner composition state diagram">
  <title>Tile corner composition state diagram</title>
  <desc>Keep the base modifier held after pressing left or right arrow. Up and down step between Top corner, Full height, and Bottom corner while preserving width. Same side arrow cycles corner width, opposite arrow resets to the opposite full half, and pushing past top maximizes or past bottom restores and ends composition.</desc>
  <defs>
    <filter id="cc-light-float" x="-18%" y="-18%" width="136%" height="146%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <filter id="cc-light-snap" x="-10%" y="-10%" width="120%" height="126%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
    <clipPath id="cc-light-top-pane-clip"><rect x="331" y="93" width="51.33" height="47" rx="4.5"/></clipPath>
    <clipPath id="cc-light-full-pane-clip"><rect x="331" y="245" width="51.33" height="94" rx="4.5"/></clipPath>
    <clipPath id="cc-light-bot-pane-clip"><rect x="331" y="444" width="51.33" height="47" rx="4.5"/></clipPath>
    <clipPath id="cc-light-max-pane-clip"><rect x="651" y="93" width="154" height="94" rx="4.5"/></clipPath>
    <clipPath id="cc-light-restore-pane-clip"><rect x="684.88" y="412.04" width="86.24" height="60.16" rx="4.5"/></clipPath>
  </defs>
