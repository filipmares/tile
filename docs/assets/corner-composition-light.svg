  <text x="24" y="304" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2937">Pick a side &amp; width</text>
  <text x="24" y="321" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#667085">Repeat to size (shown at ⅓)</text>
