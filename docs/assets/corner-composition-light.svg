    <rect x="770.5" y="17.5" width="45" height="23" rx="5" fill="#e8effd" stroke="#8ba9e9" stroke-width="1"/>
    <text x="793" y="32.91" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#2563eb">Win</text>
  </g>
  <text x="764" y="33" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#667085">Windows</text>
  <text x="706" y="33" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#667085">·</text>
