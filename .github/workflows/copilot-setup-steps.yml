name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # Must remain named `copilot-setup-steps` so Copilot Cloud Agent executes it.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain and cross-check targets
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin,x86_64-apple-darwin,x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      # Fetch all Rust and npm dependencies before running validation steps: if
      # a validation step fails, Copilot skips remaining setup steps, so fetching
      # first guarantees an offline agent still has every crate and package.
      - name: Fetch Cargo dependencies
        run: cargo fetch --locked

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/tile/ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/tile/ui
        run: npm ci

      - name: Check Tauri npm and crate versions match
        working-directory: apps/tile/ui
        run: node scripts/check-tauri-versions.mjs

      - name: Build frontend
        working-directory: apps/tile/ui
        run: npm run build

      # Restore and verify the Linux-buildable crates plus cross-target caches
      # while outbound network access is open. Linux deliberately skips
      # `apps/tile` (no GTK/WebKit deps).
      - name: Test tile-core and tile-platform
        run: cargo test -p tile-core -p tile-platform

      - name: Check macOS backend (Apple Silicon)
        run: cargo check -p tile-platform --target aarch64-apple-darwin --tests

      - name: Check macOS backend (Intel)
        run: cargo check -p tile-platform --target x86_64-apple-darwin --tests

      - name: Check Windows backend
        run: cargo check -p tile-platform --target x86_64-pc-windows-msvc --tests
