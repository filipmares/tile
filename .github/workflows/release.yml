name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  # contents: write   — create the GitHub Release and upload assets.
  # id-token: write   — mint the OIDC token that build provenance is signed with.
  # attestations: write — record the provenance attestation against the repo.
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # The draft release is created up front so the platform jobs have somewhere to
  # upload to. Doing it here — rather than letting tauri-action create it — is
  # what allows the macOS job to notarize and staple the .dmg *before* it is
  # attached to the release; tauri-action uploads as part of the build step and
  # leaves no window in between.
  #
  # It stays a draft until the `publish` job flips it, so a failing platform job
  # can never leave a half-populated release visible to users.
  # ---------------------------------------------------------------------------
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      macos-signed: ${{ steps.meta.outputs.macos_signed }}
      windows-signed: ${{ steps.meta.outputs.windows_signed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve release metadata
        id: meta
        shell: bash
        env:
          # Only presence is checked; the values never leave this step.
          # APPLE_SIGNING_IDENTITY is deliberately absent: when the .p12 is
          # supplied the bundler derives the identity from it, so requiring the
          # secret here would mislabel a genuinely signed build as unsigned.
          HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
          HAS_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
          HAS_APPLE_ID: ${{ secrets.APPLE_ID != '' }}
          HAS_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD != '' }}
          HAS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
          HAS_AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID != '' }}
          HAS_AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
          HAS_AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID != '' }}
          HAS_AZURE_ENDPOINT: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT != '' }}
          HAS_AZURE_ACCOUNT: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT != '' }}
          HAS_AZURE_PROFILE: ${{ secrets.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE != '' }}
          HAS_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          HAS_TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD != '' }}
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # A mismatch here ships installers whose in-app version disagrees with
          # the release they hang off, which is impossible to diagnose from a bug
          # report. Fail before anything is published. The version lives in three
          # places and all of them must agree; `bump.yml` edits them together.
          conf_version="$(jq -r .version apps/tile/tauri.conf.json)"
          cargo_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          npm_version="$(jq -r .version apps/tile/ui/package.json)"
          for pair in "apps/tile/tauri.conf.json:$conf_version" "Cargo.toml:$cargo_version" "apps/tile/ui/package.json:$npm_version"; do
            file="${pair%%:*}"
            version="${pair#*:}"
            if [ "$tag" != "v$version" ]; then
              echo "::error::Tag $tag does not match the version $version declared in $file (expected tag v$version)"
              exit 1
            fi
          done

          # A semver pre-release (v0.2.0-rc.1) is published but never marked
          # `latest`, so the download links on the repo front page keep pointing
          # at the last stable build.
          if [[ "$tag" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          # Signing is only claimed when *every* secret it needs is present.
          # Deriving this from a subset lets the release notes promise a signed
          # build that the bundler then declines to sign, which is worse than
          # saying nothing.
          macos_signed=true
          for flag in "$HAS_APPLE_CERTIFICATE" "$HAS_APPLE_CERTIFICATE_PASSWORD" \
                      "$HAS_APPLE_ID" "$HAS_APPLE_PASSWORD" "$HAS_APPLE_TEAM_ID"; do
            if [ "$flag" != "true" ]; then
              macos_signed=false
            fi
          done
          echo "macos_signed=$macos_signed" >> "$GITHUB_OUTPUT"

          windows_signed=true
          for flag in "$HAS_AZURE_CLIENT_ID" "$HAS_AZURE_CLIENT_SECRET" "$HAS_AZURE_TENANT_ID" \
                      "$HAS_AZURE_ENDPOINT" "$HAS_AZURE_ACCOUNT" "$HAS_AZURE_PROFILE"; do
            if [ "$flag" != "true" ]; then
              windows_signed=false
            fi
          done
          echo "windows_signed=$windows_signed" >> "$GITHUB_OUTPUT"

          if [ "$macos_signed" != "true" ]; then
            echo "::error::Updater-enabled releases require Apple Developer ID signing and notarization so updates preserve the Accessibility grant."
            exit 1
          fi
          if [ "$HAS_TAURI_SIGNING_PRIVATE_KEY" != "true" ] || \
             [ "$HAS_TAURI_SIGNING_PRIVATE_KEY_PASSWORD" != "true" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD are both required for updater-enabled releases."
            exit 1
          fi

      - name: Compose release notes
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          WINDOWS_SIGNED: ${{ steps.meta.outputs.windows_signed }}
        run: |
          set -euo pipefail
          {
            echo "## Install"
            echo
            echo "> [!IMPORTANT]"
            echo "> Tile v0.2.0 and earlier cannot update themselves. Install this release"
            echo "> manually once; future updates will be available from Tile's tray and Settings."
            echo
            echo "**macOS** — download \`Tile_*_universal.dmg\`, open it and drag **Tile** into"
            echo "Applications. The build is universal: one download for both Apple Silicon and"
            echo "Intel Macs. Tile lives in the menu bar, not the Dock."
            echo
            echo "The macOS build is signed with a Developer ID certificate and notarized by"
            echo "Apple, so it opens without any Gatekeeper workaround."
            echo
            echo "On first launch macOS asks for the **Accessibility** permission — Tile needs it"
            echo "to move and resize other applications' windows."
            echo
            echo "**Windows** — download \`Tile_*_x64-setup.exe\` and run it. It installs for the"
            echo "current user only, so no administrator prompt appears, and it fetches the"
            echo "WebView2 runtime automatically if the machine does not already have it."
            echo "Tile lives in the system tray."
            echo
            if [ "$WINDOWS_SIGNED" = "true" ]; then
              echo "The Windows installer is Authenticode-signed. SmartScreen may still warn"
              echo "until the certificate builds reputation — choose **More info ▸ Run anyway**."
            else
              echo "> [!WARNING]"
              echo "> This Windows build is **not signed**, so SmartScreen will warn that the"
              echo "> publisher is unknown. Choose **More info ▸ Run anyway** to continue."
            fi
            echo
            echo "Files ending in \`.app.tar.gz\` or \`.sig\`, plus \`latest.json\`, are"
            echo "used by Tile's updater and are not manual installers."
            echo
            echo "---"
            echo
            echo "Every installer carries a [build provenance attestation](https://github.com/${{ github.repository }}/attestations)."
            echo "Verify one with:"
            echo
            echo "\`\`\`sh"
            echo "gh attestation verify <file> --repo ${{ github.repository }}"
            echo "\`\`\`"
            echo
            echo "**Full changelog**: https://github.com/${{ github.repository }}/commits/$TAG"
          } > release-notes.md
          cat release-notes.md

      - name: Create or update the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A re-run must not disturb the publication state of an existing
            # release: passing --draft unconditionally would silently unpublish
            # a release users are already downloading. Refresh the notes only,
            # and leave a published release published.
            is_draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
            if [ "$is_draft" != "true" ]; then
              echo "::error::Published releases are immutable. Cut a new version and tag instead of replacing live assets."
              exit 1
            fi
            echo "Release $TAG already exists (draft: $is_draft); refreshing notes only."
            gh release edit "$TAG" --title "Tile $TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --title "Tile $TAG" --notes-file release-notes.md --draft --verify-tag
          fi

  build:
    name: Build (${{ matrix.os }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # The one place a build is declared to be the copy users install. It is set
    # at job level so the compiler *and* the cache key both see it; every other
    # build — local `cargo tauri build`, CI, `cargo tauri dev` — leaves it
    # unset and is therefore classified as a development build. See
    # apps/tile/src/build_kind.rs.
    env:
      TILE_BUILD_KIND: installed
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS is built as a single **universal** binary so one .dmg runs on
          # both Apple Silicon and Intel Macs — Rectangle users are on both.
          #
          # `app` is listed alongside `dmg` even though only the .dmg is
          # published: with `--bundles dmg` alone the bundler deletes
          # `Tile.app` as soon as the disk image is built ("Clean up .app if
          # only building dmg or updater"), and the verification step below —
          # hardened runtime, spctl, stapling — has nothing left to inspect.
          # The .app is a directory, so the attest and upload steps skip it and
          # it never reaches the release.
          - os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
          # Windows ships the NSIS setup .exe only. The WiX .msi is deliberately
          # not built: it can only install per-machine, so it always raises a UAC
          # prompt, and offering two installers side by side makes users choose
          # without any basis for choosing.
          - os: windows-latest
            rust-targets: ''
            args: --bundles nsis
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.create-release.outputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # Both mac arches are installed so the universal build can link them.
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          # TILE_BUILD_KIND is compiled into the binary (see
          # apps/tile/build.rs), so a release build must never restore an
          # artifact compiled without it. Adding it to the key (it is folded in
          # on top of the action's own defaults) gives release builds their own
          # cache bucket, on top of the rebuild that `cargo:rerun-if-env-changed`
          # already forces.
          env-vars: TILE_BUILD_KIND

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/tile/ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/tile/ui
        run: npm ci

      - name: Configure updater signing
        shell: bash
        env:
          IN_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          IN_TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$IN_TAURI_SIGNING_PRIVATE_KEY" ] || [ -z "$IN_TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            echo "::error::Updater signing secrets are required."
            exit 1
          fi
          echo "::add-mask::$IN_TAURI_SIGNING_PRIVATE_KEY"
          echo "::add-mask::$IN_TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          {
            echo 'TAURI_SIGNING_PRIVATE_KEY<<TAURI_SIGNING_PRIVATE_KEY_EOF'
            echo "$IN_TAURI_SIGNING_PRIVATE_KEY"
            echo 'TAURI_SIGNING_PRIVATE_KEY_EOF'
          } >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$IN_TAURI_SIGNING_PRIVATE_KEY_PASSWORD" >> "$GITHUB_ENV"

      # macOS signing is a release prerequisite because changing the code
      # signature invalidates Tile's Accessibility grant. Passing credentials
      # through as empty strings is still not harmless: the Tauri bundler treats
      # a defined APPLE_CERTIFICATE as "signing is on" and then fails while
      # importing it, so values are exported only when present.
      #
      # The notarization trio is all-or-nothing: with APPLE_ID and
      # APPLE_PASSWORD set but no APPLE_TEAM_ID, the Tauri v2 bundler hard-errors
      # rather than skipping notarization, so a partial configuration is
      # rejected here with a comprehensible message instead.
      - name: Configure macOS code signing (only when secrets are present)
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          IN_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          IN_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IN_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          IN_APPLE_ID: ${{ secrets.APPLE_ID }}
          IN_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          IN_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          export_if_set() {
            local name="$1" value="$2"
            if [ -n "$value" ]; then
              echo "::add-mask::$value"
              echo "$name=$value" >> "$GITHUB_ENV"
              echo "$name is configured"
            fi
          }
          export_if_set APPLE_CERTIFICATE "${IN_APPLE_CERTIFICATE:-}"
          export_if_set APPLE_CERTIFICATE_PASSWORD "${IN_APPLE_CERTIFICATE_PASSWORD:-}"
          export_if_set APPLE_SIGNING_IDENTITY "${IN_APPLE_SIGNING_IDENTITY:-}"

          if [ -n "${IN_APPLE_CERTIFICATE:-}" ] && [ -z "${IN_APPLE_CERTIFICATE_PASSWORD:-}" ]; then
            echo "::error::APPLE_CERTIFICATE is set but APPLE_CERTIFICATE_PASSWORD is not; the .p12 cannot be imported."
            exit 1
          fi

          if [ -n "${IN_APPLE_ID:-}" ] && [ -n "${IN_APPLE_PASSWORD:-}" ] && [ -n "${IN_APPLE_TEAM_ID:-}" ]; then
            export_if_set APPLE_ID "$IN_APPLE_ID"
            export_if_set APPLE_PASSWORD "$IN_APPLE_PASSWORD"
            export_if_set APPLE_TEAM_ID "$IN_APPLE_TEAM_ID"
          elif [ -n "${IN_APPLE_ID:-}" ] || [ -n "${IN_APPLE_PASSWORD:-}" ] || [ -n "${IN_APPLE_TEAM_ID:-}" ]; then
            echo "::error::Notarization needs APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID together; only some of them are set."
            exit 1
          fi

      # Azure Artifact Signing (formerly Trusted Signing) signs both the app
      # binary and the installer, which is why it is wired through Tauri's
      # `signCommand` rather than applied to the finished .exe afterwards:
      # signing only the installer leaves the tile.exe inside it unsigned, so
      # SmartScreen and the Defender publisher name go wrong on first launch.
      #
      # `signCommand` lives in a generated config overlay instead of
      # tauri.conf.json because a committed signCommand would make every local
      # `tauri build` — and every unsigned CI build — fail on a missing tool.
      - name: Configure Windows code signing (only when secrets are present)
        id: windows-signing
        if: matrix.os == 'windows-latest' && needs.create-release.outputs.windows-signed == 'true'
        shell: bash
        env:
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
        run: |
          set -euo pipefail
          # Pinned rather than floating: this tool holds the keys to what the
          # signature says, so an upstream release should be an explicit change
          # here, not something that arrives silently on the next tag.
          cargo install artifact-signing-cli --version 0.11.0 --locked

          # -d sets the description shown in the UAC and SmartScreen prompts;
          # without it Windows displays a random string.
          jq -n \
            --arg cmd "artifact-signing-cli -e $AZURE_ARTIFACT_SIGNING_ENDPOINT -a $AZURE_ARTIFACT_SIGNING_ACCOUNT -c $AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE -d Tile %1" \
            '{bundle: {windows: {signCommand: $cmd}}}' \
            > apps/tile/tauri.signing.conf.json
          cat apps/tile/tauri.signing.conf.json

          echo "config-arg=--config tauri.signing.conf.json" >> "$GITHUB_OUTPUT"

      # tauri-action is given no tagName, releaseName or releaseId, so it only
      # builds and reports artifactPaths. Uploading happens at the end of the
      # job, once the macOS artifacts have been notarized and stapled.
      - name: Build the app
        id: build
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # artifact-signing-cli reads these. They are always *defined* here —
          # a missing secret expands to an empty string, and a partial set could
          # even leave them non-empty while signing is off — so their presence
          # does not decide anything. What decides it is whether the configure
          # step ran and added a signCommand: with no signCommand, the bundler
          # never invokes the tool and never reads these at all.
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        with:
          projectPath: apps/tile
          args: ${{ matrix.args }} ${{ steps.windows-signing.outputs.config-arg }}

      - name: Verify updater artifacts
        shell: bash
        env:
          ARTIFACTS: ${{ steps.build.outputs.artifactPaths }}
        run: |
          set -euo pipefail
          updater=""
          signature=""
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            updater="$(echo "$ARTIFACTS" | jq -r '.[] | select(endswith(".app.tar.gz"))' | head -n1)"
            signature="$(echo "$ARTIFACTS" | jq -r '.[] | select(endswith(".app.tar.gz.sig"))' | head -n1)"
          else
            updater="$(echo "$ARTIFACTS" | jq -r '.[] | select(endswith("-setup.exe"))' | head -n1)"
            signature="$(echo "$ARTIFACTS" | jq -r '.[] | select(endswith("-setup.exe.sig"))' | head -n1)"
          fi
          if [ -z "$updater" ] || [ ! -f "$updater" ]; then
            echo "::error::Updater artifact missing from artifactPaths: $ARTIFACTS"
            exit 1
          fi
          if [ -z "$signature" ] || [ ! -s "$signature" ]; then
            echo "::error::Updater signature missing or empty in artifactPaths: $ARTIFACTS"
            exit 1
          fi
          echo "Verified updater artifact: $updater"
          echo "Verified updater signature: $signature"

          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            extract_dir="$(mktemp -d)"
            tar -xzf "$updater" -C "$extract_dir"
            payload="$(find "$extract_dir" -name 'Tile.app' -type d | head -n1)"
            if [ -z "$payload" ]; then
              echo "::error::Tile.app was not found inside $updater"
              exit 1
            fi
            codesign --verify --deep --strict --verbose=2 "$payload"
            codesign -dvvv "$payload" 2>&1 | grep -q 'flags=.*runtime' \
              || { echo "::error::Hardened runtime is not enabled on updater payload $payload"; exit 1; }
            xcrun stapler validate "$payload"
          fi

      # The Tauri bundler notarizes and staples the .app, then packages it into
      # a signed .dmg — but the .dmg itself is never submitted to Apple. An
      # un-notarized disk image makes Gatekeeper object when it is mounted from
      # a quarantined download, so submit and staple it separately.
      - name: Notarize and staple the .dmg
        if: matrix.os == 'macos-latest' && needs.create-release.outputs.macos-signed == 'true'
        shell: bash
        env:
          ARTIFACTS: ${{ steps.build.outputs.artifactPaths }}
        run: |
          set -euo pipefail
          dmg="$(echo "$ARTIFACTS" | jq -r '.[] | select(endswith(".dmg"))' | head -n1)"
          if [ -z "$dmg" ]; then
            echo "::error::No .dmg found in build artifacts: $ARTIFACTS"
            exit 1
          fi
          echo "Notarizing $dmg"
          xcrun notarytool submit "$dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$dmg"

      # A silently unsigned build is indistinguishable from a signed one until a
      # user downloads it, so assert the exact end state Gatekeeper will see.
      - name: Verify signature and notarization
        if: matrix.os == 'macos-latest' && needs.create-release.outputs.macos-signed == 'true'
        shell: bash
        env:
          ARTIFACTS: ${{ steps.build.outputs.artifactPaths }}
        run: |
          set -euo pipefail
          dmg="$(echo "$ARTIFACTS" | jq -r '.[] | select(endswith(".dmg"))' | head -n1)"
          app="$(find target -maxdepth 6 -name 'Tile.app' -type d | head -n1)"

          # Without these guards a moved bundle path turns into an opaque
          # `codesign: invalid argument` several lines later, so name the
          # missing artifact and where it was looked for.
          if [ -z "$dmg" ]; then
            echo "::error::No .dmg found in build artifacts: $ARTIFACTS"
            exit 1
          fi
          if [ -z "$app" ]; then
            echo "::error::No Tile.app found under target/ (searched 6 levels deep). Bundle layout may have changed."
            find target -maxdepth 6 -name '*.app' -type d || true
            exit 1
          fi

          echo "=== .app: $app ==="
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dvvv "$app" 2>&1 | grep -q 'flags=.*runtime' \
            || { echo "::error::Hardened runtime is not enabled on $app"; exit 1; }
          spctl --assess --type exec --verbose=4 "$app"
          xcrun stapler validate "$app"

          echo "=== .dmg: $dmg ==="
          codesign --verify --verbose=2 "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
          xcrun stapler validate "$dmg"

      # The release publishes itself once the platform jobs are green, so this
      # is the last opportunity to catch an installer that builds but does not
      # work. It exercises the exact path a user takes: run the setup, launch
      # the app, then remove it again.
      - name: Verify the Windows installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          ARTIFACTS: ${{ steps.build.outputs.artifactPaths }}
          TAG: ${{ needs.create-release.outputs.tag }}
          WINDOWS_SIGNED: ${{ needs.create-release.outputs.windows-signed }}
        run: |
          $ErrorActionPreference = 'Stop'

          $setup = ($env:ARTIFACTS | ConvertFrom-Json) |
            Where-Object { $_ -like '*-setup.exe' } | Select-Object -First 1
          if (-not $setup) {
            throw "No NSIS setup .exe found in build artifacts: $env:ARTIFACTS"
          }
          $version = $env:TAG.TrimStart('v')
          Write-Host "=== installer: $setup ==="

          # Authenticode first: an unsigned installer must never reach the
          # release once signing is supposed to be on.
          $signature = Get-AuthenticodeSignature -FilePath $setup
          Write-Host "Signature status: $($signature.Status)"
          if ($env:WINDOWS_SIGNED -eq 'true') {
            if ($signature.Status -ne 'Valid') {
              throw "Installer signature is $($signature.Status), expected Valid: $($signature.StatusMessage)"
            }
            Write-Host "Signed by: $($signature.SignerCertificate.Subject)"
            if (-not $signature.TimeStamperCertificate) {
              throw "Installer is signed but not timestamped; the signature will expire with the certificate."
            }
          }

          # /S is the NSIS silent switch. A per-user install needs no elevation,
          # which is precisely why it can be exercised on a CI runner at all.
          Write-Host "=== silent install ==="
          $install = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Installer exited with code $($install.ExitCode)"
          }

          # The Add/Remove Programs entry is the installer's contract with
          # Windows: it is how users uninstall Tile and how package managers
          # detect it. Read the install location from there rather than guessing
          # a path, so a change to the NSIS layout surfaces here.
          $arp = Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' |
            ForEach-Object { Get-ItemProperty $_.PSPath } |
            Where-Object { $_.DisplayName -eq 'Tile' } | Select-Object -First 1
          if (-not $arp) {
            throw "No 'Tile' entry under HKCU Uninstall after installing; the installer did not register itself."
          }

          # NSIS writes InstallLocation with literal quotes around it, so the
          # raw value is not a usable path — Join-Path would produce
          # `"C:\...\Tile"\tile.exe`. Strip them and any trailing separator.
          # The key is not guaranteed to exist at all, and calling .Trim() on a
          # missing one yields "you cannot call a method on a null-valued
          # expression", which says nothing about which registry value is
          # absent.
          if (-not $arp.InstallLocation) {
            throw "The 'Tile' Add/Remove Programs entry has no InstallLocation value; the installer did not record where it installed."
          }
          $installLocation = $arp.InstallLocation.Trim('"').TrimEnd('\')
          if (-not (Test-Path -PathType Container $installLocation)) {
            throw "InstallLocation '$installLocation' does not exist as a directory."
          }
          Write-Host "Install location: $installLocation"
          Write-Host "Display version:  $($arp.DisplayVersion)"
          if ($arp.DisplayVersion -ne $version) {
            throw "Installed version $($arp.DisplayVersion) does not match tag $env:TAG"
          }

          $exe = Join-Path $installLocation 'tile.exe'
          if (-not (Test-Path $exe)) {
            throw "tile.exe not found at $exe"
          }
          if ($env:WINDOWS_SIGNED -eq 'true') {
            $exeSignature = Get-AuthenticodeSignature -FilePath $exe
            if ($exeSignature.Status -ne 'Valid') {
              throw "Installed tile.exe signature is $($exeSignature.Status), expected Valid. Only the installer was signed."
            }
          }

          # Tile is tray-only and never exits on its own, so "still running
          # after a grace period" is the success condition. A missing WebView2
          # runtime or a broken bundle shows up as an immediate exit.
          Write-Host "=== launch smoke test ==="
          $app = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) {
            throw "tile.exe exited with code $($app.ExitCode) within 15s of launching."
          }
          Write-Host "Still running after 15s (pid $($app.Id))."
          Stop-Process -Id $app.Id -Force
          Start-Sleep -Seconds 2

          Write-Host "=== silent uninstall ==="
          $uninstaller = Join-Path $installLocation 'uninstall.exe'
          if (-not (Test-Path $uninstaller)) {
            throw "Uninstaller not found at $uninstaller"
          }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "Uninstaller exited with code $($uninstall.ExitCode)"
          }
          Write-Host "Installer verified."

      # Provenance ties each artifact to this workflow, this commit and this
      # runner, so a user can prove a download was not built somewhere else:
      #   gh attestation verify <file> --repo <owner>/<repo>
      - name: Collect artifact paths
        id: artifacts
        shell: bash
        env:
          ARTIFACTS: ${{ steps.build.outputs.artifactPaths }}
        run: |
          set -euo pipefail
          # The same two hazards the upload step below guards against, for the
          # same reasons: jq on the Windows runner is a native build that writes
          # CRLF, so each path arrives with a \r welded to it, and tauri-action
          # can report directory bundles that are not attestable subjects. A CR
          # here would be silently baked into the attested subject name.
          paths=()
          while IFS= read -r path; do
            path="${path%$'\r'}"
            if [ -z "$path" ] || [ -d "$path" ]; then
              continue
            fi
            paths+=("$path")
          done < <(echo "$ARTIFACTS" | jq -r '.[]')

          if [ ${#paths[@]} -eq 0 ]; then
            echo "::error::No files to attest in: $ARTIFACTS"
            exit 1
          fi
          printf 'Attesting: %s\n' "${paths[@]}"
          {
            echo 'paths<<ARTIFACT_PATHS_EOF'
            printf '%s\n' "${paths[@]}"
            echo 'ARTIFACT_PATHS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.artifacts.outputs.paths }}

      - name: Upload artifacts to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
          ARTIFACTS: ${{ steps.build.outputs.artifactPaths }}
        run: |
          set -euo pipefail
          # macOS runners still ship bash 3.2, which has no `mapfile`.
          paths=()
          while IFS= read -r path; do
            # jq on the Windows runner is a native build that writes CRLF, so
            # `read` strips the \n and leaves a \r welded to the path. gh runs
            # every argument through filepath.Glob, so that stray byte turns
            # into an opaque "no matches found for `...msi`" rather than a
            # missing-file error.
            path="${path%$'\r'}"
            if [ -z "$path" ]; then
              continue
            fi
            # tauri-action reports the .app bundle next to the .dmg. It is a
            # directory, which the upload API rejects outright, and the .dmg is
            # what users actually download. Skipping directories rather than
            # matching on ".app" keeps this correct for any future bundle type.
            if [ -d "$path" ]; then
              echo "Skipping directory artifact: $path"
              continue
            fi
            paths+=("$path")
          done < <(echo "$ARTIFACTS" | jq -r '.[]')

          if [ ${#paths[@]} -eq 0 ]; then
            echo "::error::tauri-action produced no artifacts"
            exit 1
          fi
          printf 'Uploading: %s\n' "${paths[@]}"
          gh release upload "$TAG" "${paths[@]}" --clobber

  finalize-manifest:
    name: Finalize updater manifest
    needs: [create-release, build]
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.create-release.outputs.tag }}

      - name: Install minisign verifier
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign

      - name: Assemble, validate and upload latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Updater version '$version' derived from $TAG is not valid SemVer."
            exit 1
          fi

          mkdir updater-assets
          gh release download "$TAG" --repo "${{ github.repository }}" --dir updater-assets

          mac_bundle="$(find updater-assets -maxdepth 1 -type f -name '*.app.tar.gz' | head -n1)"
          mac_sig="$(find updater-assets -maxdepth 1 -type f -name '*.app.tar.gz.sig' | head -n1)"
          win_bundle="$(find updater-assets -maxdepth 1 -type f -name '*-setup.exe' | head -n1)"
          win_sig="$(find updater-assets -maxdepth 1 -type f -name '*-setup.exe.sig' | head -n1)"
          for file in "$mac_bundle" "$mac_sig" "$win_bundle" "$win_sig"; do
            if [ -z "$file" ] || [ ! -s "$file" ]; then
              echo "::error::A required updater asset or signature is missing from the draft release."
              find updater-assets -maxdepth 1 -type f -print
              exit 1
            fi
          done

          jq -r '.plugins.updater.pubkey' apps/tile/tauri.conf.json \
            | base64 --decode > updater-public-key.txt
          public_key="$(tail -n1 updater-public-key.txt)"
          base64 --decode < "$mac_sig" > macos-updater.minisig
          base64 --decode < "$win_sig" > windows-updater.minisig
          minisign -V -P "$public_key" -x macos-updater.minisig -m "$mac_bundle"
          minisign -V -P "$public_key" -x windows-updater.minisig -m "$win_bundle"

          pub_date="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          notes="Tile $version is available. Full changelog: https://github.com/${{ github.repository }}/commits/$TAG"
          release_url="https://github.com/${{ github.repository }}/releases/download/$TAG"
          jq -n \
            --arg version "$version" \
            --arg notes "$notes" \
            --arg pub_date "$pub_date" \
            --arg mac_url "$release_url/$(basename "$mac_bundle")" \
            --arg mac_sig "$(cat "$mac_sig")" \
            --arg win_url "$release_url/$(basename "$win_bundle")" \
            --arg win_sig "$(cat "$win_sig")" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": { url: $mac_url, signature: $mac_sig },
                "darwin-x86_64": { url: $mac_url, signature: $mac_sig },
                "windows-x86_64": { url: $win_url, signature: $win_sig }
              }
            }' > latest.json

          test "$(jq -r .version latest.json)" = "$version"
          date -u -d "$(jq -r .pub_date latest.json)" >/dev/null
          for target in darwin-aarch64 darwin-x86_64 windows-x86_64; do
            jq -e --arg target "$target" \
              '.platforms[$target].url | type == "string" and length > 0' latest.json >/dev/null
            jq -e --arg target "$target" \
              '.platforms[$target].signature | type == "string" and length > 0' latest.json >/dev/null
          done

          cat latest.json
          gh release upload "$TAG" latest.json --repo "${{ github.repository }}" --clobber

  # ---------------------------------------------------------------------------
  # Publishing is a separate job so it can depend on *every* platform build.
  # `needs` alone is not enough: a job whose dependency failed is skipped, but
  # `fail-fast: false` means one platform can fail while another succeeds, and a
  # skipped job would leave the draft sitting there silently. Requiring
  # `success()` makes the intent explicit — a release is published only when
  # every platform produced a verified artifact.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish release
    needs: [create-release, build, finalize-manifest]
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
          PRERELEASE: ${{ needs.create-release.outputs.prerelease }}
        run: |
          set -euo pipefail
          if [ "$PRERELEASE" = "true" ]; then
            # `--latest=false` is explicit rather than implied: it keeps the
            # repo's download links pointing at the last stable build.
            gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false --prerelease --latest=false
            echo "Published $TAG as a pre-release."
          else
            gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false --prerelease=false --latest
            echo "Published $TAG as the latest release."
          fi
          gh release view "$TAG" --repo "${{ github.repository }}"
