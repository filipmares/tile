name: Release

on:
  push:
    tags:
      - 'v*'

# Needed so tauri-action can create the GitHub Release and upload assets.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS is built as a single **universal** binary so one .dmg runs on
          # both Apple Silicon and Intel Macs — Rectangle users are on both.
          - os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          # Windows produces an NSIS setup .exe and a WiX .msi.
          - os: windows-latest
            rust-targets: ''
            args: ''
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # Both mac arches are installed so the universal build can link them.
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/tile/ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/tile/ui
        run: npm ci

      # Signing credentials are only exported when they are actually
      # configured. Passing them through as empty strings is not harmless: the
      # Tauri bundler treats a *defined* APPLE_CERTIFICATE as "signing is on"
      # and then fails with "failed to import keychain certificate". Writing
      # them to $GITHUB_ENV conditionally leaves them undefined until real
      # secrets exist, so unsigned builds work today and adding the secrets
      # later turns signing on with no workflow change.
      - name: Configure code signing (only when secrets are present)
        shell: bash
        env:
          IN_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          IN_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IN_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          IN_APPLE_ID: ${{ secrets.APPLE_ID }}
          IN_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          IN_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IN_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          IN_TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export_if_set() {
            local name="$1" value="$2"
            if [ -n "$value" ]; then
              echo "::add-mask::$value"
              echo "$name=$value" >> "$GITHUB_ENV"
              echo "$name is configured"
            fi
          }
          export_if_set APPLE_CERTIFICATE "${IN_APPLE_CERTIFICATE:-}"
          export_if_set APPLE_CERTIFICATE_PASSWORD "${IN_APPLE_CERTIFICATE_PASSWORD:-}"
          export_if_set APPLE_SIGNING_IDENTITY "${IN_APPLE_SIGNING_IDENTITY:-}"
          export_if_set APPLE_ID "${IN_APPLE_ID:-}"
          export_if_set APPLE_PASSWORD "${IN_APPLE_PASSWORD:-}"
          export_if_set APPLE_TEAM_ID "${IN_APPLE_TEAM_ID:-}"
          export_if_set TAURI_SIGNING_PRIVATE_KEY "${IN_TAURI_SIGNING_PRIVATE_KEY:-}"
          export_if_set TAURI_SIGNING_PRIVATE_KEY_PASSWORD "${IN_TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}"

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ---------------------------------------------------------------
          # Code signing is intentionally left OFF for now. These artifacts
          # are UNSIGNED and UNNOTARIZED. macOS Gatekeeper WILL block them:
          # after downloading, a user must run
          #     xattr -d com.apple.quarantine /Applications/Tile.app
          # or right-click the app in Finder and choose "Open" the first time.
          #
          # To enable real signing later, add these repository secrets. The
          # step above picks them up automatically — no workflow change
          # required:
          #   macOS notarization / signing:
          #     APPLE_CERTIFICATE          (base64 .p12)
          #     APPLE_CERTIFICATE_PASSWORD (password for the .p12)
          #     APPLE_SIGNING_IDENTITY     ("Developer ID Application: ...")
          #     APPLE_ID                   (Apple developer account e-mail)
          #     APPLE_PASSWORD             (app-specific password)
          #     APPLE_TEAM_ID              (10-char team id)
          #   Windows updater signing:
          #     TAURI_SIGNING_PRIVATE_KEY  (Tauri updater private key)
          #     TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          # ---------------------------------------------------------------
        with:
          projectPath: apps/tile
          tagName: ${{ github.ref_name }}
          releaseName: 'Tile ${{ github.ref_name }}'
          releaseBody: |
            Tile ${{ github.ref_name }}

            > **Unsigned builds.** These binaries are not code-signed or
            > notarized. On macOS, Gatekeeper will refuse to open the app until
            > you remove the quarantine attribute:
            >
            > ```sh
            > xattr -d com.apple.quarantine /Applications/Tile.app
            > ```
            >
            > …or right-click the app in Finder and choose **Open** the first
            > time. On Windows, SmartScreen may warn you; choose
            > **More info ▸ Run anyway**.

            See the assets below to download and install.
          # Draft so a human reviews the release before it goes public.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
