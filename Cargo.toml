[workspace]
resolver = "2"
members = ["crates/tile-core", "crates/tile-platform", "apps/tile"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/filipmares/tile"

[workspace.dependencies]
tile-core = { path = "crates/tile-core" }
tile-platform = { path = "crates/tile-platform" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
semver = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
